[package]
name = "localise-cli"
version = "0.1.11"
edition = "2021"
keywords = ["cli", "localise", "localization", "translation"]
categories = ["command-line-utilities"]
readme = "README.md"
description = "A tool to manage translations with Localise.biz API"
license = "MIT OR Apache-2.0"
authors = ["Orfeas Voutsaridis <erevos13@gmail.com>"]
repository = "https://github.com/erevos-13/loco-cli-rust"
dotenvy = "0.15"


[dependencies]
clap = { version = "4.5.19", features = ["derive"] }
colored = "2.1.0"
csv = "1.1"
dotenv = "0.15.0"
indicatif = "0.17.8"
reqwest = "0.12.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40.0", features = ["full"] }

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-gcc-ar"
